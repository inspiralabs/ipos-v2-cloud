events {
  worker_connections 1024;
}

http {
  upstream auth_service      { server auth-service:3001; }
  upstream tenant_service    { server tenant-service:3002; }
  upstream pos_service       { server pos-service:3003; }
  upstream catalog_service   { server catalog-service:3004; }
  upstream inventory_service { server inventory-service:3005; }
  upstream kitchen_service   { server kitchen-service:3006; }
  upstream table_service     { server table-service:3007; }
  upstream report_service    { server report-service:3008; }
  upstream ws_gateway        { server websocket-gateway:3011; }

  # ── IP klien sebenarnya ────────────────────────────────────────────────────
  # Topologi: Cloudflare Tunnel -> cloudflared (di host) -> nginx. Setelah semua
  # port dibind ke 127.0.0.1 (docker-compose.yml), satu-satunya jalur masuk adalah
  # tunnel, jadi aman mempercayai header Cloudflare dari alamat mana pun yang
  # menjangkau kita.
  #
  # CF-Connecting-IP dipakai, BUKAN X-Forwarded-For: Cloudflare selalu MENIMPA
  # CF-Connecting-IP, sementara XFF ditambahkan di belakang apa pun yang dikirim
  # klien. Karena Fastify trustProxy:true mengambil entri paling kiri, memercayai
  # XFF berarti klien bisa memalsukan IP-nya dan melewati seluruh rate limit
  # serta lockout PIN.
  set_real_ip_from 0.0.0.0/0;
  set_real_ip_from ::/0;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  # $remote_addr di sini SUDAH hasil real_ip (IP klien asli), dan kita menimpa
  # XFF alih-alih menambahkan, supaya header kiriman klien tidak pernah ikut.
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto https;

  # Default ketat untuk seluruh API — hanya route upload yang dinaikkan di bawah.
  client_max_body_size 1m;

  # API gateway — api.inspirapos.biz.id
  server {
    listen 80;
    server_name api.inspirapos.biz.id localhost;

    location /api/v1/auth      { proxy_pass http://auth_service; }
    location /api/v1/admin     { proxy_pass http://tenant_service; }
    location /api/v1/tenants {
      # Jangan tambah proxy_set_header di sini — itu membatalkan seluruh
      # override real-IP di level http (lihat kasus /ws yang sama).
      client_max_body_size 10m;
      proxy_pass http://tenant_service;
    }
    location /api/v1/public    { proxy_pass http://tenant_service; } # landing-page: POST /api/v1/public/leads (form /demo)
    location /api/clients      { proxy_pass http://tenant_service; } # ipos-offline: register + license-status
    location /api/v1/pos       { proxy_pass http://pos_service; }
    location /api/v1/catalog {
      # Foto menu dari kamera HP rutin 3-8 MB. Default nginx 1m membuat fitur
      # upload foto gagal 413 di produksi.
      # Jangan tambah proxy_set_header di sini — itu membatalkan seluruh
      # override real-IP di level http (lihat kasus /ws yang sama).
      client_max_body_size 10m;
      proxy_pass http://catalog_service;
    }
    location /api/v1/menus     { proxy_pass http://catalog_service; } # endpoint publik self-order: /api/v1/menus/public/:qr_token
    location /api/v1/inventory { proxy_pass http://inventory_service; }
    location /api/v1/kitchen   { proxy_pass http://kitchen_service; }
    location /api/v1/tables    { proxy_pass http://table_service; }
    location /api/v1/reports   { proxy_pass http://report_service; }
    # /api/v1/notify SENGAJA tidak di-expose di sini — notification-service hanya
    # dipanggil service lain lewat Docker network internal (lihat INTERNAL_API_KEY
    # di notification-service/src/index.ts). Jangan tambah route publik untuk ini.

    location /ws {
      proxy_pass http://ws_gateway;
      proxy_http_version 1.1;
      # proxy_set_header di level manapun MENGGANTIKAN seluruh proxy_set_header
      # level induk (aturan nginx untuk directive array) — tanpa baris di bawah,
      # /ws tidak mewarisi override real-IP di atas dan meneruskan
      # X-Forwarded-For kiriman klien apa adanya ke websocket-gateway.
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
