events {
  worker_connections 1024;
}

http {
  upstream auth_service      { server auth-service:3001; }
  upstream tenant_service    { server tenant-service:3002; }
  upstream pos_service       { server pos-service:3003; }
  upstream catalog_service   { server catalog-service:3004; }
  upstream inventory_service { server inventory-service:3005; }
  upstream kitchen_service   { server kitchen-service:3006; }
  upstream table_service     { server table-service:3007; }
  upstream report_service    { server report-service:3008; }
  upstream ws_gateway        { server websocket-gateway:3011; }

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # API gateway — api.inspirapos.biz.id
  server {
    listen 80;
    server_name api.inspirapos.biz.id localhost;

    location /api/v1/auth      { proxy_pass http://auth_service; }
    location /api/v1/admin     { proxy_pass http://tenant_service; }
    location /api/v1/tenants   { proxy_pass http://tenant_service; }
    location /api/clients      { proxy_pass http://tenant_service; } # ipos-offline: register + license-status
    location /api/v1/pos       { proxy_pass http://pos_service; }
    location /api/v1/catalog   { proxy_pass http://catalog_service; }
    location /api/v1/menus     { proxy_pass http://catalog_service; } # endpoint publik self-order: /api/v1/menus/public/:qr_token
    location /api/v1/inventory { proxy_pass http://inventory_service; }
    location /api/v1/kitchen   { proxy_pass http://kitchen_service; }
    location /api/v1/tables    { proxy_pass http://table_service; }
    location /api/v1/reports   { proxy_pass http://report_service; }
    # /api/v1/notify SENGAJA tidak di-expose di sini — notification-service hanya
    # dipanggil service lain lewat Docker network internal (lihat INTERNAL_API_KEY
    # di notification-service/src/index.ts). Jangan tambah route publik untuk ini.

    location /ws {
      proxy_pass http://ws_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
