services:
  redis:
    image: redis:7-alpine
    # ponytail: tidak di-expose ke host — cuma dipakai antar-container lewat redis://redis:6379.
    # Kalau perlu redis-cli dari host, `docker compose exec redis redis-cli`.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Tidak ada `ports:` di service backend mana pun — semuanya hanya dipanggil nginx
  # lewat Docker network. Sebelumnya semua dipublish ke 0.0.0.0 sehingga gateway bisa
  # dilewati total dari internet (mis. langsung ke :3002/api/v1/admin), dan
  # notification-service terjangkau di :3009 padahal nginx.conf:38-40 sengaja menolak
  # mengeksposnya. Kalau perlu akses dari host untuk debug:
  #   docker compose exec auth-service wget -qO- http://localhost:3001/health
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  tenant-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: tenant-service
    environment:
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      OFFLINE_LICENSE_SALT_LITE: ${OFFLINE_LICENSE_SALT_LITE}
      OFFLINE_LICENSE_SALT_PRO: ${OFFLINE_LICENSE_SALT_PRO}
      AUTH_SERVICE_URL: http://auth-service:3001
      NOTIFICATION_SERVICE_URL: http://notification-service:3009
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      FONNTE_TOKEN: ${FONNTE_TOKEN}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      - auth-service
      - notification-service
    restart: unless-stopped

  pos-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: pos-service
    environment:
      PORT: 3003
      DATABASE_URL: "${DATABASE_URL}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      KITCHEN_SERVICE_URL: http://kitchen-service:3006
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      CATALOG_SERVICE_URL: http://catalog-service:3004
      TABLE_SERVICE_URL: http://table-service:3007
      INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
      CORS_ORIGIN: ${CORS_ORIGIN}
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: catalog-service
    environment:
      PORT: 3004
      DATABASE_URL: "${DATABASE_URL}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      TABLE_SERVICE_URL: http://table-service:3007
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: inventory-service
    environment: { PORT: 3005, DATABASE_URL: "${DATABASE_URL}", JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}", INTERNAL_API_KEY: "${INTERNAL_API_KEY}", CORS_ORIGIN: "${CORS_ORIGIN}" }
    restart: unless-stopped

  kitchen-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: kitchen-service
    environment:
      PORT: 3006
      DATABASE_URL: "${DATABASE_URL}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      REDIS_URL: redis://redis:6379
      INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  table-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: table-service
    environment:
      PORT: 3007
      DATABASE_URL: "${DATABASE_URL}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      REDIS_URL: redis://redis:6379
      PUBLIC_ORDER_URL: "${PUBLIC_ORDER_URL:-http://localhost:3012/order}"
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  report-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: report-service
    environment: { PORT: 3008, DATABASE_URL: "${DATABASE_URL}", JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}", CORS_ORIGIN: "${CORS_ORIGIN}" }
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    environment:
      PORT: 3009
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FONNTE_TOKEN: ${FONNTE_TOKEN}
      CORS_ORIGIN: ${CORS_ORIGIN}
    restart: unless-stopped

  websocket-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: websocket-gateway
    environment:
      PORT: 3011
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin-app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_NAME: admin-app
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      PORT: 3010
    depends_on:
      - auth-service
      - tenant-service
    restart: unless-stopped

  tenant-app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_NAME: tenant-app
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3012:3100"
    environment:
      PORT: 3100
    depends_on:
      - auth-service
      - tenant-service
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # Hanya loopback: cloudflared jalan di host dan menembak localhost:80.
      # 0.0.0.0 akan membuat gateway terjangkau langsung dari internet, melewati tunnel.
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - tenant-service
    restart: unless-stopped

volumes:
  redis_data:
