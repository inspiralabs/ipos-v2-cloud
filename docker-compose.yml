# VPS Inspiralabs: app ipos-v2-cloud. Domain lewat Traefik (network edge), tanpa port publik:
#   api.inspirapos.biz.id → nginx gateway, admindash.inspirapos.biz.id → admin-app, tenant.inspirapos.biz.id → tenant-app
x-node-health: &node-health
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s
x-web-health: &web-health
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ponytail: tidak di-expose ke host — cuma dipakai antar-container lewat redis://redis:6379.
    # Kalau perlu redis-cli dari host, `docker compose exec redis redis-cli`.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Tidak ada `ports:` di service backend mana pun — semuanya hanya dipanggil nginx
  # lewat Docker network. Sebelumnya semua dipublish ke 0.0.0.0 sehingga gateway bisa
  # dilewati total dari internet (mis. langsung ke :3002/api/v1/admin), dan
  # notification-service terjangkau di :3009 padahal nginx.conf:38-40 sengaja menolak
  # mengeksposnya. Kalau perlu akses dari host untuk debug:
  #   docker compose exec auth-service wget -qO- http://localhost:3001/health
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *node-health

  tenant-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: tenant-service
    environment:
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      OFFLINE_LICENSE_SALT_LITE: ${OFFLINE_LICENSE_SALT_LITE}
      OFFLINE_LICENSE_SALT_PRO: ${OFFLINE_LICENSE_SALT_PRO}
      AUTH_SERVICE_URL: http://auth-service:3001
      NOTIFICATION_SERVICE_URL: http://notification-service:3009
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      FONNTE_TOKEN: ${FONNTE_TOKEN}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      - auth-service
      - notification-service
    restart: unless-stopped
    healthcheck: *node-health

  pos-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: pos-service
    environment:
      PORT: 3003
      DATABASE_URL: "${DATABASE_URL}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      KITCHEN_SERVICE_URL: http://kitchen-service:3006
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      CATALOG_SERVICE_URL: http://catalog-service:3004
      TABLE_SERVICE_URL: http://table-service:3007
      INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
      CORS_ORIGIN: ${CORS_ORIGIN}
    restart: unless-stopped
    healthcheck: *node-health

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: catalog-service
    environment:
      PORT: 3004
      DATABASE_URL: "${DATABASE_URL}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      TABLE_SERVICE_URL: http://table-service:3007
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    restart: unless-stopped
    healthcheck: *node-health

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: inventory-service
    environment: { PORT: 3005, DATABASE_URL: "${DATABASE_URL}", JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}", INTERNAL_API_KEY: "${INTERNAL_API_KEY}", CORS_ORIGIN: "${CORS_ORIGIN}" }
    restart: unless-stopped
    healthcheck: *node-health

  kitchen-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: kitchen-service
    environment:
      PORT: 3006
      DATABASE_URL: "${DATABASE_URL}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      REDIS_URL: redis://redis:6379
      INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *node-health

  table-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: table-service
    environment:
      PORT: 3007
      DATABASE_URL: "${DATABASE_URL}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      REDIS_URL: redis://redis:6379
      PUBLIC_ORDER_URL: "${PUBLIC_ORDER_URL:-http://localhost:3012/order}"
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *node-health

  report-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: report-service
    environment: { PORT: 3008, DATABASE_URL: "${DATABASE_URL}", JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}", CORS_ORIGIN: "${CORS_ORIGIN}" }
    restart: unless-stopped
    healthcheck: *node-health

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    environment:
      PORT: 3009
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FONNTE_TOKEN: ${FONNTE_TOKEN}
      CORS_ORIGIN: ${CORS_ORIGIN}
    restart: unless-stopped
    healthcheck: *node-health

  websocket-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: websocket-gateway
    environment:
      PORT: 3011
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck: *node-health

  admin-app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_NAME: admin-app
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    expose: ["3010"]
    environment:
      PORT: 3010
      HOSTNAME: 0.0.0.0           # Next standalone: dengar di semua interface (healthcheck + Traefik)
    networks: [default, edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.ipos-admin.rule=Host(`admindash.inspirapos.biz.id`)
      - traefik.http.services.ipos-admin.loadbalancer.server.port=3010
    healthcheck: *web-health
    depends_on:
      - auth-service
      - tenant-service
    restart: unless-stopped

  tenant-app:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP_NAME: tenant-app
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    expose: ["3100"]
    environment:
      PORT: 3100
      HOSTNAME: 0.0.0.0           # Next standalone: dengar di semua interface (healthcheck + Traefik)
    networks: [default, edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.ipos-tenant.rule=Host(`tenant.inspirapos.biz.id`)
      - traefik.http.services.ipos-tenant.loadbalancer.server.port=3100
    healthcheck: *web-health
    depends_on:
      - auth-service
      - tenant-service
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    # Tanpa port ke host: Cloudflare Tunnel → Traefik (VPS) → nginx lewat network edge. Satu-satunya jalur masuk
    # tetap tunnel, jadi asumsi set_real_ip_from di nginx/nginx.conf tetap berlaku (Traefik meneruskan CF-Connecting-IP).
    expose: ["80"]
    networks: [default, edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.ipos-v2-cloud-api.rule=Host(`api.inspirapos.biz.id`)
      - traefik.http.services.ipos-v2-cloud-api.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://auth-service:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - tenant-service
    restart: unless-stopped

volumes:
  redis_data:

networks:
  edge:
    external: true
